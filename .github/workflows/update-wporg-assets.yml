name: Update WordPress.org readme and assets

# Pushes readme.txt and .wordpress-org/ (icons, banners, screenshots) to the plugin's
# wordpress.org SVN repository without a new release. Code changes still go out through
# a GitHub release (deploy-to-wporg.yml).
on:
  push:
    branches: [main]
    paths:
      - readme.txt
      - .wordpress-org/**

permissions:
  contents: read

jobs:
  update:
    name: Update readme and assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Update WordPress.org readme and assets
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ai-provider-for-deapi
          IGNORE_OTHER_FILES: true
